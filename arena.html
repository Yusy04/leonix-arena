<meta name="viewport" content="width=device-width, initial-scale=1"/>

<style>
  body.no-grid::before { display: none; }
  body.density-compact { --s-12: 32px; --s-8: 20px; --s-6: 16px; --s-4: 12px; }
  /* Tweaks panel */
  .tweaks-panel {
    position: fixed; right: 24px; bottom: 24px; z-index: 95;
    width: 280px;
    background: var(--ink-800);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-3);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(113,200,115,0.15);
    overflow: hidden;
    animation: scaleIn var(--t-base) var(--ease-spring);
  }
  .tweaks-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--hairline);
  }
  .tweaks-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; }
  .tweak-section { display: flex; flex-direction: column; gap: 8px; }
  .seg {
    display: flex; gap: 2px; padding: 3px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--hairline);
    border-radius: var(--r-2);
  }
  .seg-opt {
    flex: 1; padding: 6px 8px;
    font-size: 11px; font-family: var(--font-mono);
    color: var(--fg-muted);
    text-transform: lowercase;
    border-radius: calc(var(--r-2) - 2px);
    cursor: pointer;
    background: transparent; border: 0;
  }
  .seg-opt:hover { color: var(--fg-strong); }
  .seg-opt.is-active { background: var(--brand-500); color: #0b1410; }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="app/ui.jsx"></script>
<script type="text/babel" src="app/data.jsx"></script>
<script type="text/babel" src="app/nav.jsx"></script>
